<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React + TanStack Query via ESM.sh</title>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    // Импорт React и ReactDOM через esm.sh
    import * as React from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

    // Импорт QueryClient и провайдера
    import { QueryClient, QueryClientProvider, useQuery } 
      from 'https://esm.sh/@tanstack/react-query@latest';

    // Импорт Devtools
    import { ReactQueryDevtools } 
      from 'https://esm.sh/@tanstack/react-query-devtools@latest?dev';

    // Создаём клиент
    const queryClient = new QueryClient();

    // Пример компонента, делающего запрос
    function Example() {
      const { data, isLoading, error } = useQuery({
        queryKey: ['hello'],
        queryFn: async () => {
          const res = await fetch('https://api.chucknorris.io/jokes/random');
          const json = await res.json();
          return json;
        },
      });

      if (isLoading) return React.createElement('div', null, 'Loading...');
      if (error) return React.createElement('div', null, 'Error: ' + error.message);

      return React.createElement('div', null, `Joke: ${data.value}`);
    }

    function App() {
      return React.createElement('hiii', null)
    }

    // Рендерим в DOM
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(App, null)
    );
  </script>
</body>
</html>
